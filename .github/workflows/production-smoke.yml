name: Production smoke

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && startsWith(github.event.deployment.environment, 'Production') && startsWith(github.event.deployment_status.environment_url, 'https://noblu-beauty-room77-'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run smoke
        env:
          SMOKE_BASE_URL: https://noblu.pl
          EXPECTED_RELEASE: ${{ github.event_name == 'deployment_status' && github.event.deployment.sha || '' }}
